plugins {
    id 'com.android.application'
}

// 发布签名从环境变量读取，仓库里不保存任何密钥。
// 本地：设好下面四个变量后 assembleRelease 才会签名，否则产物是 unsigned。
// CI ：见 .github/workflows/release.yml
def ksFile = System.getenv('POWERGAUGE_KEYSTORE_FILE')
def ksPassword = System.getenv('POWERGAUGE_KEYSTORE_PASSWORD')
def ksAlias = System.getenv('POWERGAUGE_KEY_ALIAS')
def ksKeyPassword = System.getenv('POWERGAUGE_KEY_PASSWORD')
def hasKeystore = ksFile != null && !ksFile.trim().isEmpty()

android {
    namespace 'com.powergauge.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.powergauge.app"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.5.1"
    }

    buildFeatures {
        // 标题栏版本号直接取 BuildConfig.VERSION_NAME，免得和这里写的值对不上
        buildConfig true
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile file(ksFile)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 全部为系统 API，不需要 lint 阻断构建
        abortOnError false
    }
}

// 刻意不引入任何第三方依赖：AppCompat / Material / Kotlin 全部不用，
// 这样只要装了 Android Studio 就能直接构建，不会被依赖版本卡住。
dependencies {
}
