name: Release APK

# 打 tag（如 v1.6.0）时自动构建 APK 并挂到 GitHub Release 上。
# 也可以在 Actions 页面手动触发一次，产物只在 Artifacts 里，不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POWERGAUGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secrets.POWERGAUGE_KEYSTORE_BASE64，构建出的 APK 没有签名、装不上"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/powergauge.jks"
          echo "POWERGAUGE_KEYSTORE_FILE=$RUNNER_TEMP/powergauge.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          POWERGAUGE_KEYSTORE_PASSWORD: ${{ secrets.POWERGAUGE_KEYSTORE_PASSWORD }}
          POWERGAUGE_KEY_ALIAS: ${{ secrets.POWERGAUGE_KEY_ALIAS }}
          POWERGAUGE_KEY_PASSWORD: ${{ secrets.POWERGAUGE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          [ -z "$version" ] && version="dev"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "dist/PowerGauge-$version.apk"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerGauge-${{ github.ref_name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
