name: Release APK

# 打 tag（如 v1.6.0）时自动构建 APK 并挂到 GitHub Release 上。
# 也可以在 Actions 页面手动触发一次，产物只在 Artifacts 里，不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::runner 上没有 Android SDK"
            exit 1
          fi
          echo "SDK=$SDK"
          SDKM=$(find "$SDK" -path '*/bin/sdkmanager' -type f | head -n1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.POWERGAUGE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POWERGAUGE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POWERGAUGE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.POWERGAUGE_KEY_PASSWORD }}
        run: |
          echo "base64 length: ${#KEYSTORE_BASE64}"
          echo "store  password set: $([ -n "$KEYSTORE_PASSWORD" ] && echo yes || echo no)"
          echo "key    alias       : ${KEY_ALIAS:-<empty>}"
          echo "key    password set: $([ -n "$KEY_PASSWORD" ] && echo yes || echo no)"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::secrets.POWERGAUGE_KEYSTORE_BASE64 为空。请确认它填在 Repository secrets（不是 Environment secrets、不是 Variables）里"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::密钥库密码或别名缺失"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/powergauge.p12"
          echo "decoded size: $(wc -c < "$RUNNER_TEMP/powergauge.p12") bytes"

          echo "POWERGAUGE_KEYSTORE_FILE=$RUNNER_TEMP/powergauge.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          POWERGAUGE_KEYSTORE_PASSWORD: ${{ secrets.POWERGAUGE_KEYSTORE_PASSWORD }}
          POWERGAUGE_KEY_ALIAS: ${{ secrets.POWERGAUGE_KEY_ALIAS }}
          POWERGAUGE_KEY_PASSWORD: ${{ secrets.POWERGAUGE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          [ -z "$version" ] && version="dev"
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "dist/PowerGauge-$version.apk"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerGauge-${{ github.ref_name }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
